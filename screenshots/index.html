<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formatra — Screenshots</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px 64px; background: #f4f3f0; color: #1b1b18; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
    p.sub { margin: 0 0 32px; color: #6b6a64; }
    figure { margin: 0 0 40px; }
    figcaption { margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #3a3934; }
    img { display: block; width: 100%; height: auto; border: 1px solid #dcdad3; border-radius: 12px; box-shadow: 0 10px 30px rgba(20, 20, 15, .08); }
    code { background: #e8e6e0; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Formatra — Screenshots</h1>
    <p class="sub">Halaman utama, Dashboard, dan Word ke PDF · 1440 × 900</p>

    <figure>
      <figcaption>1. Halaman utama — <code>screenshots/01-halaman-utama.png</code></figcaption>
      <img src="01-halaman-utama.png" alt="Halaman utama Formatra" />
    </figure>

    <figure>
      <figcaption>2. Dashboard — <code>screenshots/02-dashboard.png</code></figcaption>
      <img src="02-dashboard.png" alt="Dashboard Formatra" />
    </figure>

    <figure>
      <figcaption>3. Word ke PDF — <code>screenshots/03-word-ke-pdf.png</code></figcaption>
      <img src="03-word-ke-pdf.png" alt="Halaman tool Word ke PDF" />
    </figure>
  </main>
</body>
</html>
